on:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v2
        with:
          node-version: ${{ matrix.node-version }}

      - name: npm ci, build and test
        env:
          REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL }}
          REACT_APP_API_TOKEN: ${{ secrets.REACT_APP_API_TOKEN }}
        run: |
          npm ci
          npm run build --if-present
          npm run jsdoc --if-present
          npm test

      - name: Cypress run
        uses: cypress-io/github-action@v6
        env:
          REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL }}
          REACT_APP_API_TOKEN: ${{ secrets.REACT_APP_API_TOKEN }}
        with:
          build: npm run build
          start: npm start

      - name: Copy docs to build folder
        run: cp -r docs build/documentation

      # - name: Copy docs to build folder
      #   run: cp -r coverage build/test-coverage

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Setup Pages
        uses: actions/configure-pages@v3

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/
      - run: npm ci

      - name: Authenticate with npm 
        run: echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc

      - name: Get local version
        id: local_version
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
          echo "version=$(node -p "require('./package.json').version")"
      
      - name: Get package name
        id: package_name
        run: echo "name=$(node -p "require('./package.json').name")" >> $GITHUB_OUTPUT

      - name: Get published version
        id: published_version
        run: |
          PUBLISHED=$(npm view "${{ steps.package_name.outputs.name }}" version || echo "0.0.0")
          echo "version=$PUBLISHED" >> $GITHUB_OUTPUT
          echo "version=$PUBLISHED"

      - name: Compare versions
        id: version_check
        run: |
          PUBLISHED_NUM="${PUBLISHED#version=}"
          LOCAL_NUM="${LOCAL#version=}"
          if [ "$(printf '%s\n' "$PUBLISHED" "$LOCAL" | sort -V | head -n1)" != "$PUBLISHED" ]; then
            echo "should_publish=true" >> $GITHUB_OUTPUT
            echo "should_publish=true"
          else
            echo "should_publish=false" >> $GITHUB_OUTPUT
            echo "should_publish=false"
          fi

      - name: Build for NPM
        if: steps.version_check.outputs.should_publish == 'true'
        run: npm run build-npm-ci

      - name: Publish to NPM
        if: steps.version_check.outputs.should_publish == 'true'
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      
      - name: Create Git tag
        if: steps.version_check.outputs.should_publish == 'true'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "v$VERSION"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip message
        if: steps.version_check.outputs.should_publish == 'false'
        run: echo "Version not incremented. Skipping publish."
      # - name: build and publish package on npm
      #   run: |
      #     git config --global user.email "kenzo.thomias@ynov.com"
      #     git config --global user.name "Kenzo Thomias"
      #     npm run build-npm-ci
      #     npm version patch
      #     npm publish
      #     git add .
      #     git commit -m "updated version"
      #     git push
      #   env:
      #     NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  docker-test:
    # needs: publish-npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build mysql image
        run: docker build -t test-migration .  

      - name: Build API image
        run: docker build -t user_api -f python.Dockerfile .

      - name: Start MySQL container
        run: |
          docker run -d \
            --name mysql-test \
            -e MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }} \
            -p 3306:3306 \
            test-migration

      - name: Wait for MySQL
        run: |
          echo "Waiting for MySQL..."
          for i in {1..30}; do
            docker exec mysql-test mysqladmin ping -h "host.docker.internal" --silent && break
            sleep 2
          done

      - name: Start API container
        run: |
          docker run -d \
            --name api-test \
            -e MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }} \
            -e MYSQL_DATABASE=${{ secrets.MYSQL_DATABASE }} \
            -e MYSQL_HOST=172.17.0.1 \
            -p 8000:8000 \
            user_api
      
      - name: Wait for API
        run: |
          echo "Waiting for API..."
          for i in {1..30}; do
            sleep 1

      - name: debug containers
        run: docker ps -a
      - name: debug containers
        run: curl 172.17.0.1:8000/users

      - name: Test /users endpoint
        run: |
          RESPONSE=$(curl 172.17.0.1:8000/users)
          echo "HTTP response code: $RESPONSE"
          if [ "$RESPONSE" != "200" ]; then
            echo "API /users endpoint failed"
            exit 1
          fi
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Push API image to Docker Hub
        run: |
          docker tag user_api ${{ secrets.DOCKER_USERNAME }}/user_api:0.1.0
          docker tag test-migration ${{ secrets.DOCKER_USERNAME }}/migration_mysql:0.1.0

          docker push ${{ secrets.DOCKER_USERNAME }}/user_api:0.1.0
          docker push ${{ secrets.DOCKER_USERNAME }}/migration_mysql:0.1.0
  deploy:
    needs: docker-test
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy-to-pages.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
