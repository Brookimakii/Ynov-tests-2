on:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v2
        with:
          node-version: ${{ matrix.node-version }}

      - name: npm ci, build and test
        env:
          REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL }}
          REACT_APP_API_TOKEN: ${{ secrets.REACT_APP_API_TOKEN }}
        run: |
          npm ci
          npm run build --if-present
          npm run jsdoc --if-present
          npm test

      - name: Cypress run
        uses: cypress-io/github-action@v6
        env:
          REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL }}
          REACT_APP_API_TOKEN: ${{ secrets.REACT_APP_API_TOKEN }}
        with:
          build: npm run build
          start: npm start

      - name: Copy docs to build folder
        run: cp -r docs build/documentation

      # - name: Copy docs to build folder
      #   run: cp -r coverage build/test-coverage

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Setup Pages
        uses: actions/configure-pages@v3

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/
      - run: npm ci

      - name: Authenticate with npm 
        run: echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc

      - name: Get local version
        id: local_version
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
          echo "version=$(node -p "require('./package.json').version")"
      
      - name: Get published version
        id: published_version
        run: |
          PUBLISHED=$(npm view ${{ steps.package_name.outputs.name }} version || echo "0.0.0")
          echo "version=$PUBLISHED" >> $GITHUB_OUTPUT
          echo "version=$PUBLISHED"

      - name: Compare versions
        id: version_check
        run: |
          if [ "$(printf '%s\n' "${{ steps.published_version.outputs.version }}" "${{ steps.local_version.outputs.version }}" | sort -V | head -n1)" != "${{ steps.published_version.outputs.version }}" ]; then
            echo "should_publish=true" >> $GITHUB_OUTPUT
            echo "should_publish=true"
          else
            echo "should_publish=false" >> $GITHUB_OUTPUT
            echo "should_publish=false"
          fi
      - name: Build for NPM
        if: steps.version_check.outputs.should_publish == 'true'
        run: npm run build-npm-ci

      - name: Publish to NPM
        if: steps.version_check.outputs.should_publish == 'true'
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Skip message
        if: steps.version_check.outputs.should_publish == 'false'
        run: echo "Version not incremented. Skipping publish."
      # - name: build and publish package on npm
      #   run: |
      #     git config --global user.email "kenzo.thomias@ynov.com"
      #     git config --global user.name "Kenzo Thomias"
      #     npm run build-npm-ci
      #     npm version patch
      #     npm publish
      #     git add .
      #     git commit -m "updated version"
      #     git push
      #   env:
      #     NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  deploy:
    needs: publish-npm
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy-to-pages.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
