on:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v2
        with:
          node-version: ${{ matrix.node-version }}

      - name: npm ci, build and test
        env:
          REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL }}
          REACT_APP_API_TOKEN: ${{ secrets.REACT_APP_API_TOKEN }}
        run: |
          npm ci
          npm run build --if-present
          npm run jsdoc --if-present
          npm test

      - name: Cypress run
        uses: cypress-io/github-action@v6
        env:
          REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL }}
          REACT_APP_API_TOKEN: ${{ secrets.REACT_APP_API_TOKEN }}
        with:
          build: npm run build
          start: npm start

      - name: Copy docs to build folder
        run: cp -r docs build/documentation

      # - name: Copy docs to build folder
      #   run: cp -r coverage build/test-coverage

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Setup Pages
        uses: actions/configure-pages@v3

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

      - name: Authenticate with npm 
        run: echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc
      
      - name: build and publish package on npm
        run: |
          git config --global user.email "kenzo.thomias@ynov.com"
          git config --global user.name "Kenzo Thomias"
          npm run build-npm-ci
          npm version patch
          npm publish
          git add .
          git commit -m "updated version"
          git push
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy-to-pages.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
